# Propeller coefficients from J. Forster, "System Identification of the Crazyflie 2.0
# Nano Quadrocopter", Bachelor's thesis, ETH Zurich, 2015.
# Must match crazyflie2_forster.xacro (forster_parameters:=true).
motor_constant: 1.71465181e-08   # thrust = motor_constant * omega^2 [kg m]
moment_constant: 0.004459273     # yaw torque = moment_constant * thrust [m]
max_rotor_velocity: 3052         # [rad/s]
