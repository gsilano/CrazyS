# Quintic spline used by rotors_gazebo/hovering_example_spline. The spline starts
# at start_time [s] of simulation time and lasts time_final seconds.

/**:
  ros__parameters:
    start_time: 3.0               # [s]
    time_final: {time: 10.0}      # duration [s]
    position_initial: {x: 0.0, y: 0.0, z: 0.0}
    position_final: {x: 0.0, y: 0.0, z: 1.0}
    velocity_initial: {x: 0.0, y: 0.0, z: 0.0}
    velocity_final: {x: 0.0, y: 0.0, z: 0.0}
    acceleration_initial: {x: 0.0, y: 0.0, z: 0.0}
    acceleration_final: {x: 0.0, y: 0.0, z: 0.0}
    orientation_initial: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    orientation_final: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    angularRate_initial: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    angularRate_final: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    angularDoubleRate_initial: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    angularDoubleRate_final: {roll: 0.0, pitch: 0.0, yaw: 0.0}
