# Builds the dev/ros2-jazzy branch (Jazzy + Gazebo Harmonic) in a Docker container with the
# matching Ubuntu and ROS version, on every push and pull request to this branch.
# The weekly check on master calls this workflow too, to catch breakages in the
# dependencies when nobody pushes.
#
# The unit tests of rotors_control are run as well.

name: Jazzy + Gazebo Harmonic

on:
  push:
    branches: [dev/ros2-jazzy]
  pull_request:
    branches: [dev/ros2-jazzy]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and test (dev/ros2-jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git \
            ros-jazzy-ros-gz ros-jazzy-actuator-msgs ros-jazzy-xacro ros-jazzy-joy \
            ros-jazzy-robot-state-publisher

      # The code is fetched with plain git, as in the ROS 1 workflows. When the
      # workflow is called by the weekly check on master, inputs.ref names this branch.
      - name: Get the code
        shell: bash
        run: |
          mkdir -p ~/ros2_ws/src/CrazyS && cd ~/ros2_ws/src/CrazyS
          git init -q
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch -q --depth 1 origin "${{ inputs.ref || github.ref }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='Building %H (%s)'

      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ~/ros2_ws
          colcon build --event-handlers console_cohesion+
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  # Builds the Debian packages the way the ROS buildfarm does after a bloom
  # release: bloom-generate writes the debian/ directory of each package, then
  # the package is built with debhelper and installed, in dependency order. A
  # failure here means a missing dependency in a package.xml, an install rule
  # that forgets a file, or a CHANGELOG that bloom cannot read.
  debian:
    name: Debian packages (dev/ros2-jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install bloom
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3-bloom \
            python3-colcon-common-extensions fakeroot debhelper dh-python

      - name: Get the code
        shell: bash
        run: |
          mkdir -p ~/src/CrazyS && cd ~/src/CrazyS
          git init -q
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch -q --depth 1 origin "${{ inputs.ref || github.ref }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='Packaging %H (%s)'

      # The CrazyS packages depend on each other but are not in rosdistro yet, so
      # rosdep is told how their Debian packages will be named.
      - name: Teach rosdep the CrazyS package names
        shell: bash
        run: |
          cd ~/src/CrazyS
          for name in $(colcon list --names-only); do
            echo "$name: {ubuntu: [ros-jazzy-${name//_/-}]}"
          done > /tmp/crazys-rosdep.yaml
          cat /tmp/crazys-rosdep.yaml
          echo "yaml file:///tmp/crazys-rosdep.yaml" > /etc/ros/rosdep/sources.list.d/10-crazys.list
          rosdep update --rosdistro jazzy -q

      - name: Generate, build and install the packages
        shell: bash
        run: |
          cd ~/src/CrazyS
          colcon list --topological-order | while read -r name path type; do
            echo "::group::$name"
            cd ~/src/CrazyS/$path
            rosdep install --from-paths . --rosdistro jazzy -y -q
            bloom-generate rosdebian --ros-distro jazzy
            fakeroot debian/rules binary
            deb=$(ls ../ros-jazzy-${name//_/-}_*.deb)
            apt-get install -y -qq "$(realpath $deb)"
            echo "::endgroup::"
          done
          ls -1 ~/src/CrazyS/*.deb

      - name: Check the installed packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          ros2 pkg list | grep -E '^rotors_'
          ros2 pkg executables rotors_gazebo
          ros2 interface show rotors_comm/msg/DroneState > /dev/null
          ls /opt/ros/jazzy/share/rotors_gazebo/launch
